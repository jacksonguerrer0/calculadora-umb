plugins {
    id 'com.android.application'
}
android {
    namespace 'com.calculadora'
    compileSdk 35

    defaultConfig {
        applicationId 'com.calculadora'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
